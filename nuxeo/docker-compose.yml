services:

  # ── Oracle XE 11g ─────────────────────────────────────────────────────────
  oracle:
    image: oracleinanutshell/oracle-xe-11g:latest
    platform: linux/amd64
    container_name: oracle-xe-11g
    environment:
      ORACLE_ALLOW_REMOTE: "true"
      ORACLE_PASSWORD: ${ORACLE_SYSTEM_PASSWORD}
      ORACLE_SYSTEM_PASSWORD: ${ORACLE_SYSTEM_PASSWORD}
      NUXEO_USER: ${ORACLE_USER}
      NUXEO_PASSWORD: ${ORACLE_PASSWORD}
      NUXEO_USER7: ${ORACLE_USER7}
      NUXEO_PASSWORD7: ${ORACLE_PASSWORD7}
    ports:
      - "${ORACLE_CONTAINER_PORT}:1521"
      - "8089:8080"   # Oracle Enterprise Manager (optional)
    volumes:
      - oracle_data:/u01/app/oracle
      - ./dpdump:/u01/app/oracle/admin/XE/dpdump
      - ./scripts/oracle-init:/docker-entrypoint-initdb.d
    healthcheck:
      # Two-phase check: (1) Oracle listener is up, (2) init script created NUXEO_OWNER.
      # nuxeo6/nuxeo7 depend on service_healthy, so they won't start until both pass.
      test: ["CMD", "sh", "-c", "export ORACLE_HOME=/u01/app/oracle/product/11.2.0/xe && export PATH=$$ORACLE_HOME/bin:$$PATH && echo \"SELECT username FROM dba_users WHERE username='NUXEO_OWNER';\" | sqlplus -S system/${ORACLE_SYSTEM_PASSWORD}@localhost/XE | grep -q NUXEO_OWNER"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - nuxeo-net

  # # ── Mailhog (dummy SMTP — catches all outgoing emails) ───────────────────
  # mailhog:
  #   image: mailhog/mailhog:latest
  #   platform: linux/amd64
  #   container_name: mailhog
  #   ports:
  #     - "1025:1025"   # SMTP
  #     - "8025:8025"   # Web UI → http://localhost:8025
  #   networks:
  #     - nuxeo-net

  # ── Nuxeo 6.0 (default — starts with: docker compose up) ──────────────────
  nuxeo6:
    image: nuxeo:6.0
    platform: linux/amd64
    container_name: n6
    depends_on:
      oracle:
        condition: service_healthy
    ports:
      - "${NUXEO6_PORT}:8080"
    environment:
      NUXEO_DB_TYPE: oracle
      NUXEO_DB_HOST: oracle
      NUXEO_DB_NAME: ${ORACLE_SID}
      NUXEO_DB_USER: ${ORACLE_USER}
      NUXEO_DB_PASSWORD: ${ORACLE_PASSWORD}
      NUXEO_BINARY_STORE: /var/lib/nuxeo/data/binaries
      NUXEO_URL: ${NUXEO6_URL}
      JAVA_OPTS: "-Xms512m -Xmx1536m"
    volumes:
      # Appended to nuxeo.conf on first boot (mail, ES off, scheduler off)
      - ./nuxeo6.conf:/nuxeo.conf
      - ./scripts/configure-tomcat-proxy.sh:/docker-entrypoint-initnuxeo.d/10-configure-proxy.sh:ro
      - ./scripts/public-origin-filter:/opt/nuxeo/public-origin-filter:ro
      - ./ojdbc/ojdbc6.jar:/opt/nuxeo/server/lib/ojdbc6.jar
      - nuxeo6_data:/var/lib/nuxeo/data
      - ./binaries/n6:/var/lib/nuxeo/data/binaries
      - nuxeo6_logs:/var/log/nuxeo
    networks:
      - nuxeo-net

  nuxeo6-proxy:
    image: nginx:alpine
    container_name: nuxeo-6-proxy
    profiles:
      - proxy
    depends_on:
      - nuxeo6
    ports:
      - "${NUXEO6_PORT}:8080"
    volumes:
      - ./nginx/nuxeo6.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - nuxeo-net

  # ── Nuxeo 7.10 (start manually after schema clone + migration) ────────────
  #
  #   docker compose --profile n7 up -d nuxeo7
  #
  nuxeo7:
    image: nuxeo:7.10
    platform: linux/amd64
    container_name: n7
    profiles:
      - n7
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      NUXEO_DB_TYPE: oracle
      NUXEO_DB_HOST: oracle
      NUXEO_DB_NAME: ${ORACLE_SID}
      NUXEO_DB_USER: ${ORACLE_USER7}
      NUXEO_DB_PASSWORD: ${ORACLE_PASSWORD7}
      NUXEO_BINARY_STORE: /var/lib/nuxeo/data/binaries
      NUXEO_URL: ${NUXEO7_URL}
      JAVA_OPTS: "-Xms512m -Xmx1536m"
    ports:
      - "${NUXEO7_PORT}:8080"
    volumes:
      - ./nuxeo7.conf:/nuxeo.conf
      - ./ojdbc/ojdbc6.jar:/opt/nuxeo/server/lib/ojdbc6.jar
      - nuxeo7_data:/var/lib/nuxeo/data
      - ./binaries/n7:/var/lib/nuxeo/data/binaries
      - nuxeo7_logs:/var/log/nuxeo
    networks:
      - nuxeo-net
  
  tomcat7:
    image: tomcat:7.0-jdk8-openjdk
    platform: linux/amd64
    container_name: t7
    profiles:
      - t7
    ports:
      - "8081:8080"
    volumes:
      # Mounts the dummy application into Tomcat's deployment folder
      - ./dummy-app.war:/usr/local/tomcat/webapps/dummy-app.war
    environment:
      - CATALINA_OPTS=-Xms512m -Xmx1024m
    restart: unless-stopped
    networks:
      - nuxeo-net

volumes:
  oracle_data:
  nuxeo6_data:
  nuxeo6_logs:
  nuxeo7_data:
  nuxeo7_logs:

networks:
  nuxeo-net:
    driver: bridge
