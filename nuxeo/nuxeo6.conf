# Appended to nuxeo.conf on first boot by the entrypoint.
# DB connection is set via environment variables in docker-compose.yml (sourced from .env).
# This file handles settings the entrypoint doesn't expose as env vars.

# No Elasticsearch
elasticsearch.enabled=false

# No Quartz scheduler
org.nuxeo.ecm.core.scheduler.enabled=false

# Mail (Mailhog dummy SMTP — view caught emails at http://localhost:8025)
mail.smtp.host=mailhog
mail.smtp.port=1025
mail.transport.host=mailhog
mail.transport.port=1025
mail.transport.protocol=smtp
nuxeo.notification.eMailSender=nuxeo@mock.local
nuxeo.notification.replyToAddress=noreply@mock.local
