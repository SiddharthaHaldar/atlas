map "${NUXEO6_PUBLIC_URL}" $nuxeo6_origin {
    ~^(https?://[^/]+) $1;
    default "";
}

map "${NUXEO7_PUBLIC_URL}" $nuxeo7_origin {
    ~^(https?://[^/]+) $1;
    default "";
}

resolver 127.0.0.11 valid=10s;

map "$upstream_status:$upstream_http_content_type" $js_content_type {
    "200:"  application/javascript;
    default $upstream_http_content_type;
}

map $http_x_forwarded_proto $external_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_x_forwarded_host $external_host {
    default $http_x_forwarded_host;
    ""      $http_host;
}

map $external_host $nuxeo_host {
    ~^(.*):80$ $1;
    default    $external_host;
}

log_format proxy_trace escape=json
    '{"time":"$time_iso8601",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"host_in":"$http_host",'
    '"xfh_in":"$http_x_forwarded_host",'
    '"xfp_in":"$http_x_forwarded_proto",'
    '"xfport_in":"$http_x_forwarded_port",'
    '"host_upstream":"$nuxeo_host",'
    '"scheme_upstream":"$external_scheme",'
    '"port_upstream":"443",'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_location":"$upstream_http_location",'
    '"status":"$status",'
    '"location_out":"$sent_http_location",'
    '"upstream_time":"$upstream_response_time",'
    '"request_time":"$request_time"}';

server {
    listen 8080;
    server_name _;
    access_log /dev/stdout proxy_trace;

    proxy_http_version 1.1;
    proxy_set_header Host $nuxeo_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $external_scheme;
    proxy_set_header X-Forwarded-Host $nuxeo_host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header nuxeo-virtual-host $nuxeo6_origin/;
    proxy_redirect off;

    set $nuxeo6_upstream nuxeo6:8080;

    location / {
        proxy_pass http://$nuxeo6_upstream;
    }

    location ^~ /nuxeo/js/ {
        proxy_pass http://$nuxeo6_upstream;
        proxy_hide_header Content-Type;
        add_header Content-Type $js_content_type;
    }
}

server {
    listen 8081;
    server_name _;
    access_log /dev/stdout proxy_trace;

    proxy_http_version 1.1;
    proxy_set_header Host $nuxeo_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $external_scheme;
    proxy_set_header X-Forwarded-Host $nuxeo_host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header nuxeo-virtual-host $nuxeo7_origin/;
    proxy_redirect off;

    set $nuxeo7_upstream nuxeo7:8080;

    location / {
        proxy_pass http://$nuxeo7_upstream;
    }

    location ^~ /nuxeo/js/ {
        proxy_pass http://$nuxeo7_upstream;
        proxy_hide_header Content-Type;
        add_header Content-Type $js_content_type;
    }
}